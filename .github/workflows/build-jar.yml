name: Build Mouse Wheelie JAR

on:
  workflow_dispatch:
  push:
    branches:
      - mc-26.3-noip

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Minecraft 26.3 only
        run: ./gradlew build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: mouse-wheelie-mc-26.3
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
